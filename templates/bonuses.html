{% extends "base.html" %}
{% block title %}Bonuses{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto p-4 bg-white rounded shadow">
  <h2 class="text-xl font-semibold mb-4">Add Bonus</h2>

  <form method="POST" action="/bonuses" class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Servant</label>
      <select name="servant_id" class="w-full border rounded px-2 py-1 text-sm">
        {% for servant in servants %}
          <option value="{{ servant.id }}">{{ servant.name }}</option>
        {% endfor %}
      </select>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Amount</label>
      <input type="number" step="0.01" name="amount" required class="w-full border rounded px-2 py-1 text-sm">
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Date</label>
      <input type="date" name="paid_date" value="{{ current_date }}" class="w-full border rounded px-2 py-1 text-sm">
    </div>

    <div class="md:col-span-3">
      <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded">
        Save Bonus
      </button>
    </div>
  </form>

  <h3 class="text-lg font-semibold mb-2">Bonus History</h3>
  <div class="overflow-x-auto">
    <table class="min-w-full border text-sm text-left">
      <thead class="bg-gray-100">
        <tr>
          <th class="border px-3 py-2">Servant</th>
          <th class="border px-3 py-2">Amount</th>
          <th class="border px-3 py-2">Date</th>
        </tr>
      </thead>
      <tbody>
        {% for bonus in bonuses %}
          <tr class="hover:bg-gray-50">
            <td class="border px-3 py-2">{{ bonus.servant_name }}</td>
            <td class="border px-3 py-2">{{ bonus.amount }}</td>
            <td class="border px-3 py-2">{{ bonus.paid_date }}</td>
          </tr>
        {% else %}
          <tr>
            <td colspan="3" class="border px-3 py-2 text-center text-gray-500">No bonuses recorded</td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
