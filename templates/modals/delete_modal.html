<!-- Delete Confirmation Modal -->
<div id="deleteModal" class="fixed inset-0 bg-black bg-opacity-30 hidden z-50 flex items-center justify-center">
  <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-sm text-center">
    <h2 class="text-lg font-semibold mb-2 text-gray-800">Confirm Delete</h2>
    <p class="text-sm text-gray-600 mb-4">Are you sure you want to delete <span id="delete-servant-name" class="font-medium text-red-600"></span>?</p>
    
    <form id="deleteForm" method="POST">
      <div class="flex justify-center gap-4">
        <button type="button" onclick="closeDeleteModal()"
          class="px-4 py-2 bg-gray-200 text-gray-700 rounded hover:bg-gray-300">Cancel</button>
        <button type="submit"
          class="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700">Delete</button>
      </div>
    </form>
  </div>
</div>
