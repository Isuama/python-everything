<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Dashboard{% endblock %}</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Optional: Custom styles or favicon -->
  <link rel="icon" href="/static/favicon.ico">
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-white shadow-sm">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-xl font-semibold">Servant Manager</h1>
      <nav class="space-x-4">
        <a href="/" class="text-blue-600 hover:underline">Home</a>
        <a href="/servants" class="text-blue-600 hover:underline">Servants</a>
        <a href="/loans" class="text-blue-600 hover:underline">Loans</a>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="bg-white border-t text-center text-xs text-gray-400 py-2 mt-4">
    &copy; {{ current_year | default(2025) }} Servant Manager App
  </footer>
</body>
</html>
