{% extends "base.html" %}
{% block title %}Utility{% endblock %}

{% block content %}
<div class="max-w-6xl mx-auto mt-8 px-4">
  <h1 class="text-2xl font-semibold text-gray-800 mb-6">Manage Utility Types</h1>

  <!-- Form for adding a new utility type -->
  <form method="POST" action="/addUtility" class="bg-white border rounded-lg p-6 shadow-sm mb-8">
    <div class="flex flex-col md:flex-row md:items-end gap-4">
      <div class="flex-1">
        <label for="utility_name" class="block text-sm font-medium text-gray-700 mb-1">Utility Type</label>
        <input name="name" type="text" id="utility_name" placeholder="e.g., Electricity, Water"
          class="w-full border border-gray-300 rounded-md px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
          required>
      </div>
      <div class="w-full md:w-auto">
        <button type="submit"
          class="w-full bg-blue-600 text-white px-6 py-2 rounded-md hover:bg-blue-700 transition">Add</button>
      </div>
    </div>
  </form>

  <!-- Utility Types List -->
  <h3 class="text-xl font-semibold text-gray-700 mb-4">Existing Utility Types</h3>
  <div class="overflow-x-auto">
    <table class="min-w-full border border-gray-200 rounded-lg overflow-hidden text-sm text-left">
      <thead class="bg-gray-100 text-gray-700 uppercase text-xs">
        <tr>
          <th class="px-6 py-3 border-b">Utility Type</th>
          <th class="px-6 py-3 border-b">Status</th>
        </tr>
      </thead>
      <tbody class="bg-white divide-y divide-gray-100">
        {% for s in utilities %}
        <tr class="hover:bg-gray-50">
          <td class="px-6 py-3 text-gray-800">{{ s.name }}</td>
          <td class="px-6 py-3">
            <span class="inline-block px-3 py-1 text-sm rounded-full bg-green-100 text-green-800 font-medium">Active</span>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
